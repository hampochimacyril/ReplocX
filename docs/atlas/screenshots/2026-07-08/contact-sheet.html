<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReplocX Research Atlas — W4 release contact sheet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; color: #17202b; background: #eef2f6; font: 14px/1.4 Arial, sans-serif; }
      header { margin-bottom: 24px; }
      h1 { margin: 0 0 6px; font-size: 28px; }
      p { margin: 0; color: #566273; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      figure { margin: 0; padding: 14px; border: 1px solid #cdd6e0; border-radius: 10px; background: white; }
      img { display: block; width: 100%; height: 430px; object-fit: cover; object-position: top; border: 1px solid #e0e6ed; }
      figcaption { margin-top: 10px; font-weight: 700; }
      .wide { grid-column: 1 / -1; }
      .wide img { height: 520px; }
    </style>
  </head>
  <body>
    <header>
      <h1>ReplocX Research Atlas — W4 release audit</h1>
      <p>Certified 720-cell A/C/B/D tier · R9 PASS · f2v3_final · equity READY · July 8, 2026</p>
    </header>
    <main>
      <figure class="wide">
        <img src="atlas-enabled-desktop-overview.png" alt="Desktop national pivot" />
        <figcaption>Desktop — national pivot and figure parity</figcaption>
      </figure>
      <figure>
        <img src="atlas-enabled-tablet-results.png" alt="Tablet results view" />
        <figcaption>Tablet — results and threshold framing</figcaption>
      </figure>
      <figure>
        <img src="atlas-enabled-mobile-d-contrasts.png" alt="Mobile D contrasts" />
        <figcaption>Mobile — sealed-passive D contrasts</figcaption>
      </figure>
      <figure>
        <img src="atlas-w4-equity-ready.png" alt="Equity READY view" />
        <figcaption>W4 — equity READY with verified source and uncertainty notes</figcaption>
      </figure>
      <figure>
        <img src="atlas-w4-exports-provenance.png" alt="Exports and provenance" />
        <figcaption>W4 — exports/provenance aligned to f2v3_final</figcaption>
      </figure>
      <figure class="wide">
        <img src="atlas-disabled-public-demo.png" alt="Public demo disabled state" />
        <figcaption>Public demo — Atlas disabled</figcaption>
      </figure>
    </main>
  </body>
</html>
