[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "replocx-client"
version = "1.0.0"
description = "Stdlib-only Python client for the ReplocX REST API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ReplocX" }]
keywords = ["resstock", "comstock", "urbanopt", "openstudio", "energyplus", "building-stock"]
dependencies = []  # standard library only

[project.optional-dependencies]
geo = ["geopandas>=0.12"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["rle_client"]
