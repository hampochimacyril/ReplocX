<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transparent representative-location selection for national building-stock and heat-health simulations." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#071827" />
    <title>Representative Location Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071827'/%3E%3Cpath d='M16 6c-3.6 0-6.5 2.9-6.5 6.5C9.5 17.6 16 26 16 26s6.5-8.4 6.5-13.5C22.5 8.9 19.6 6 16 6z' fill='none' stroke='%237ed7ce' stroke-width='2'/%3E%3Ccircle cx='16' cy='12.3' r='2.4' fill='%237ed7ce'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">R</div>
          <div>
            <p class="eyebrow">Research workspace</p>
            <h1>Representative<br />Location Explorer</h1>
          </div>
        </div>
        <nav id="primary-nav" aria-label="Sections"></nav>
        <div class="sidebar-footer">
          <div class="status-dot" id="data-status"><span></span> Read-only analysis inputs</div>
          <p>Method version 2.0</p>
        </div>
      </aside>
      <div class="main-column">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">Menu</button>
          <div>
            <p class="eyebrow" id="page-kicker">National decision support</p>
            <h2 id="page-title">Overview dashboard</h2>
          </div>
          <div class="topbar-actions">
            <span class="scenario-pill"><i></i> Baseline research scenario</span>
            <button class="icon-button" id="refresh-view" title="Refresh data" aria-label="Refresh data">↻</button>
          </div>
        </header>
        <main id="workspace" tabindex="-1">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading reproducible location-selection inputs…</p>
          </div>
        </main>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
