# Render Blueprint - private ReplocX Research Atlas candidate.
#
# Deploy this branch from GitHub:
#   https://github.com/hampochimacyril/ReplocX
#   branch: codex/atlas-release-candidate
#
# This Blueprint intentionally does NOT bake certified analysis, Atlas data, or
# f2v3 figures into the image. It creates a paid Docker web service with a
# persistent disk at /var/data. Populate that disk out of band, then redeploy or
# restart the service before owner sign-off.
#
# Render note: this profile uses the app token as the mandatory reviewer gate.
# It does not reproduce the VM/Caddy Basic-auth edge layer by itself. Add Render
# inbound IP restrictions and/or an external Basic-auth proxy if policy requires
# the original two-layer C1 boundary.

services:
  - type: web
    name: replocx-private-atlas
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: codex/atlas-release-candidate
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    disk:
      name: replocx-private-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: RLE_ENABLE_ATLAS
        value: "1"
      - key: RLE_REQUIRE_AUTH
        value: "1"
      - key: RLE_PRIVATE_AUTH_TOKEN
        sync: false
      - key: RLE_ANALYSIS_DATA_DIR
        value: /var/data/analysis
      - key: RLE_ATLAS_DATA_DIR
        value: /var/data/atlas/replocx_tmy3_wallfix_4scen
      - key: RLE_ATLAS_FIGURE_DIR
        value: /var/data/atlas-figures/f2v3_final
      - key: RLE_SCENARIO_DB
        value: /var/data/replocx/scenarios.sqlite3
      - key: RLE_LOG_LEVEL
        value: INFO
